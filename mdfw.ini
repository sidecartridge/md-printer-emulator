; EmuMD: this firmware's own C code built for the host and run in emumd's
; Hatari, with an emulated Multi-device on the cartridge port (emu/README.md).
;
;   tools/dev/build_hatari_fork.sh     # once: emumd's Hatari
;   tools/dev/mdfw.sh build            # build/md-printer-emulator.mdfw
;   tools/dev/mdfw.sh run [--headless --frames N --screenshot out.png]

[firmware]
name = md-printer-emulator
template = sidecartridge
uuid = 44444444-4444-4444-8444-444444444444

[sources]
; Everything rp/src builds (rp/src/CMakeLists.txt) but the hardware layer
; EmuMD stands in for, which it leaves out by itself (romemul.c,
; commemul.c, select.c, hw_config.c, sdcard.c).
files =
    rp/src/*.c
    rp/src/httpc/httpc.c
    rp/src/md5/md5.c
    rp/src/settings/settings.c
    rp/src/u8g2/*.c
    emu/*.c
exclude =
    ; mbedTLS's clock, compiled only with APP_DOWNLOAD_HTTPS=1
    rp/src/mbedtls_ms_time.c
    ; the physical displays' set-ups: the template draws into memory only
    rp/src/u8g2/u8g2_d_setup.c

[compile]
include =
    rp/src
    rp/src/include
    rp/src/settings
    rp/src/u8g2
defines =
    DISPLAY_ATARIST
    PICO_FLASH_ASSUME_CORE0_SAFE=1
    APP_DOWNLOAD_HTTPS=0
    BOARD_TYPE_PICO_W=1
    BOARD_TYPE_PICO=0
    BOARD_TYPE_CUSTOM16MB=0

[wifi]
; lwIP's HTTP client, which rp/src/httpc/httpc.c calls into
apps = http/http_client.c
arch = poll

[run]
sd = emu/sd
; An ST with TOS 1.04 (UK, 50 Hz), linked locally as emu/tos/tos104uk.img
; (gitignored); --tos emu/tos/tos162uk.img --machine ste for the STE.
tos = emu/tos/tos104uk.img
machine = st
